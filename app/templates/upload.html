{% extends 'base.html' %}
{% block title %}Upload Companies{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-header">Upload Company List</div>
        <div class="card-body">
          <p class="text-muted">
            Upload a CSV file with columns
            <code>name</code>, <code>street</code>, <code>street_number</code>,
            <code>postal_code</code>, and <code>city</code>.
          </p>
          <form method="post" enctype="multipart/form-data">
            <div class="mb-3">
              <label for="file" class="form-label">Company CSV</label>
              <input class="form-control" type="file" id="file" name="file" accept=".csv" required>
            </div>
            <button type="submit" class="btn btn-primary">Upload</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
