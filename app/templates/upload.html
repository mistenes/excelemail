{% extends 'base.html' %}
{% block title %}Add Company{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-header">Add a Company</div>
        <div class="card-body">
          <p class="text-muted">
            CSV uploads are temporarily disabled. Enter the company details manually below.
          </p>
          <form method="post">
            <div class="mb-3">
              <label for="name" class="form-label">Company Name</label>
              <input class="form-control" type="text" id="name" name="name" required>
            </div>
            <div class="mb-3">
              <label for="street" class="form-label">Street</label>
              <input class="form-control" type="text" id="street" name="street" required>
            </div>
            <div class="mb-3">
              <label for="street_number" class="form-label">Street Number</label>
              <input class="form-control" type="text" id="street_number" name="street_number" required>
            </div>
            <div class="mb-3">
              <label for="postal_code" class="form-label">Postal Code</label>
              <input class="form-control" type="text" id="postal_code" name="postal_code" required>
            </div>
            <div class="mb-3">
              <label for="city" class="form-label">City</label>
              <input class="form-control" type="text" id="city" name="city" required>
            </div>
            <button type="submit" class="btn btn-primary">Save Company</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
