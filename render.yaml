services:
  - type: web
    name: shipment-planner
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shipment-planner-db
          property: connectionString
      - key: FLASK_ENV
        value: production

databases:
  - name: shipment-planner-db
    plan: free
